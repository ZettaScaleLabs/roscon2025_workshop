services:
  # Robot container
  robot:
    image: ${IMAGE_NAME:-zettascaletech/roscon2025_workshop}
    build:
      context: ./docker
      dockerfile: Dockerfile
    hostname: robot
    stdin_open: true
    tty: true
    ports:
      - "6080:80"  # VNC access to the container's desktop
      - "7447:7447/tcp"  # Zenoh default port
      - "7447:7447/udp"
    volumes:
      - ./container_volumes/robot_container:/home/ubuntu/container_data
    working_dir: /home/ubuntu
    cap_add:
      - NET_ADMIN  # for network_limit.sh script
    shm_size: '640m'
    security_opt:
      - seccomp:unconfined
    networks:
      sim_network:
        ipv4_address: 172.1.0.2
    ulimits:
      # By default, Ubuntu supports 8192 KiB, which is not enough for Zenoh shared memory. Set to unlimited
      memlock:
        soft: -1  # "unlimited"
        hard: -1  # "unlimited"
      # For Zenoh to set thread priority for its SHM watchdog (works better and avoid warnings)
      rtprio:
        soft: 99
        hard: 99
      nice:
        soft: -20
        hard: -20

  # Controller container
  control:
    image: ${IMAGE_NAME:-zettascaletech/roscon2025_workshop}
    hostname: control
    stdin_open: true
    tty: true
    ports:
      - "6081:80"  # VNC access to the container's desktop
    volumes:
      - ./container_volumes/control_container:/home/ubuntu/container_data
    working_dir: /home/ubuntu
    cap_add:
      - NET_ADMIN  # for network_limit.sh script
    shm_size: '640m'
    security_opt:
      - seccomp:unconfined
    networks:
      sim_network:
        ipv4_address: 172.1.0.3
    ulimits:
      # By default, Ubuntu supports 8192 KiB, which is not enough for Zenoh shared memory. Set to unlimited
      memlock:
        soft: -1  # "unlimited"
        hard: -1  # "unlimited"
      # For Zenoh to set thread priority for its SHM watchdog (works better and avoid warnings)
      rtprio:
        soft: 99
        hard: 99
      nice:
        soft: -20
        hard: -20

networks:
  # Custom bridge network with a specific subnet
  sim_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.1.0.0/16
